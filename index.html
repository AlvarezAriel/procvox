<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GenVox</title>
<style>html, body { margin: 0; height: 100%; background: #05070d; color: #ccc; font: 13px system-ui, sans-serif; }
body { display: grid; grid-template-columns: var(--lw, 25%) 4px 1fr 4px var(--rw, 18%); }
#left { background: #0c0f16; min-width: 0; display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); min-height: 0; }
#toolbar { display: flex; gap: 8px; padding: 6px 8px; align-items: center; border-bottom: 1px solid #222; }
#toolbar select, #toolbar button { font: inherit; background: #11151c; color: inherit; border: 1px solid #2a313b; padding: 3px 8px; cursor: pointer; }
#toolbar button:hover { background: #1a1f2a; }
button#build { background: #16a34a; color: #fff; border-color: #15803d; margin-left: auto; }
#tabs { display: flex; border-bottom: 1px solid #222; }
#tabs button { background: transparent; color: #999; border: 0; border-bottom: 2px solid transparent; padding: 5px 12px; cursor: pointer; font: inherit; }
#tabs button.active { color: #fff; border-bottom-color: #16a34a; }
#tabs button:hover { background: #1a1f2a; }
#editor, #materials, #vox { grid-row: 3; grid-column: 1; min-height: 0; min-width: 0; }
.hidden { display: none; }
#materials, #vox { display: flex; flex-direction: column; }
#materials.hidden, #vox.hidden { display: none; }
#mat-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px; color: #6b7280; font: 11px system-ui, sans-serif; border-bottom: 1px solid #222; }
#mat-list { flex: auto; min-height: 0; overflow: auto; padding: 4px 6px; display: flex; flex-direction: column; gap: 3px; border-bottom: 1px solid #222; }
.mat-row { display: flex; align-items: center; gap: 6px; }
.mat-row input, #mat-head span { box-sizing: border-box; }
.mat-row .mat-idx, #mat-head .mat-idx { flex: 0 0 30px; text-align: right; color: #6b7280; font: 11px ui-monospace, monospace; }
.mat-row input[type=color], #mat-head .h-color { flex: 0 0 28px; }
.mat-row input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid #2a313b; background: #000; cursor: pointer; -webkit-appearance: none; appearance: none; }
.mat-row input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
.mat-row input[type=color]::-webkit-color-swatch { border: 0; }
.mat-row input[type=color]::-moz-color-swatch { border: 0; }
.mat-row input.mat-num, #mat-head .h-num { flex: 0 0 28px; text-align: center; }
#mat-head .h-num { color: #6b7280; font: 11px ui-monospace, monospace; }
.mat-row input.mat-label, #mat-head .h-label { flex: 1 1 auto; min-width: 0; }
.mat-row input.mat-num, .mat-row input.mat-label { font: inherit; background: #11151c; color: inherit; border: 1px solid #2a313b; padding: 2px 4px; }
.mat-row input.mat-num { font: 11px ui-monospace, monospace; padding: 2px 1px; appearance: textfield; -moz-appearance: textfield; }
.mat-row input.mat-num::-webkit-inner-spin-button, .mat-row input.mat-num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
#vox-list { flex: auto; min-height: 0; overflow: auto; padding: 4px 0; border-bottom: 1px solid #222; }
#vox-list:empty::before { content: 'No vox files imported.'; display: block; padding: 8px 10px; color: #6b7280; font-size: 12px; }
.vox-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font: 12px ui-monospace, monospace; }
.vox-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vox-row .vox-size { flex: 0 0 auto; color: #6b7280; font-style: normal; }
.vox-row button { background: none; color: #888; border: 0; cursor: pointer; padding: 0 6px; font: inherit; }
.vox-row button:hover { color: #ef4444; }
#mat-save, #vox-import { align-self: flex-end; margin: 6px; background: #16a34a; color: #fff; border: 1px solid #15803d; padding: 4px 14px; cursor: pointer; font: inherit; }
#mat-save:hover, #vox-import:hover { background: #15803d; }
#center { display: grid; grid-template-rows: var(--th, 75%) auto 4px 1fr; min-height: 0; min-width: 0; }
#edit-toolbar { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: #0c0f16; border-top: 1px solid #222; }
#edit-toolbar select, #edit-toolbar input { font: inherit; background: #11151c; color: inherit; border: 1px solid #2a313b; padding: 3px 6px; }
#edit-toolbar input[type=number] { width: 5em; }
#render { position: relative; overflow: hidden; background: #000; min-height: 0; min-width: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fps { position: absolute; top: 8px; left: 8px; padding: 2px 6px; background: rgba(0,0,0,0.5); color: #9fe; font: 12px ui-monospace, monospace; pointer-events: none; display: none; }
#play-overlay { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: #05070d; }
#play-btn { font: 600 22px system-ui, sans-serif; letter-spacing: 1px; color: #fff; background: #16a34a; border: 1px solid #15803d; border-radius: 6px; padding: 12px 40px; cursor: pointer; }
#play-btn:hover { background: #15803d; }
#log { background: #0c0f16; font: 12px ui-monospace, monospace; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
#log-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid #222; }
#log-toolbar button { font: inherit; background: #11151c; color: inherit; border: 1px solid #2a313b; padding: 3px 10px; cursor: pointer; }
#log-toolbar button:hover { background: #1a1f2a; }
#log-entries { flex: auto; min-height: 0; overflow-y: auto; padding: 6px 8px; }
#log .entry { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
#log .lvl-error { color: #ef4444; }
#log .lvl-warn  { color: #eab308; }
#log .lvl-info  { color: #cbd5e1; }
#log .lvl-debug { color: #6b7280; }
#right { background: #0c0f16; padding: 10px 12px; overflow: auto; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#right label { display: flex; align-items: center; gap: 6px; }
#right details { border: 1px solid #1c2230; border-radius: 4px; background: #0a0d14; }
#right details > summary { cursor: pointer; padding: 5px 8px; font-weight: 600; color: #9aa7b8; user-select: none; }
#right details > summary:hover { color: #c9d4e3; }
#right details[open] > summary { border-bottom: 1px solid #1c2230; }
#right details > .sec { display: flex; flex-direction: column; gap: 9px; padding: 8px; }
#right label.col { flex-direction: column; align-items: stretch; gap: 2px; }
#right label.col input[type=range] { width: 100%; }
#settings-actions { display: flex; gap: 8px; }
#settings-actions button { flex: 1; font: inherit; background: #11151c; color: inherit; border: 1px solid #2a313b; padding: 4px 8px; cursor: pointer; }
#settings-actions button:hover { background: #1a1f2a; }
#settings-actions #settings-reset { border-color: #7c2d2d; }
#settings-actions #settings-reset:hover { background: #2a1a1a; }
#vh1, #vh2 { background: #222; cursor: col-resize; }
#hh { background: #222; cursor: row-resize; }
.ace_shp-modifier { color: #79C0FF; }
.ace_shp-terminal { color: #FFA657; }
.ace_shp-layout   { color: #D2A8FF; }</style>
</head>
<body>
<div id="left">
<div id="toolbar">
<select id="shp"></select>
<button id="build">Build</button>
</div>
<div id="tabs">
<button class="active" data-pane="editor">Editor</button>
<button data-pane="materials">Materials</button>
<button data-pane="vox">Vox files</button>
</div>
<div id="editor"></div>
<div id="materials" class="hidden">
<div id="mat-head">
<span class="mat-idx">#</span>
<span class="h-color">Col</span>
<span class="h-num">Emis</span>
<span class="h-num">Refl</span>
<span class="h-num">Tran</span>
<span class="h-num">Jit</span>
<span class="h-label">Label</span>
</div>
<div id="mat-list"></div>
<button id="mat-save">Apply all</button>
</div>
<div id="vox" class="hidden">
<div id="vox-list"></div>
<button id="vox-import">Import</button>
</div>
<input id="vox-picker" type="file" accept=".vox" multiple style="display:none">
</div>
<div id="vh1"></div>
<div id="center">
<div id="render"><canvas id="canvas" width="960" height="540"></canvas><div id="fps">FPS —</div><div id="play-overlay"><button id="play-btn">Play</button></div></div>
<div id="edit-toolbar">
<select id="edit-mode">
<option value="4" selected>Cube</option>
<option value="3">Filled Sphere</option>
<option value="0">Hollow Sphere</option>
<option value="1">emissive</option>
<option value="2">delete</option>
</select>
<select id="edit-material"></select>
<input id="edit-radius" type="number" min="1" max="512" step="1" value="16">
</div>
<div id="hh"></div>
<div id="log">
<div id="log-toolbar"><button id="clear-logs">Clear Logs</button><button id="export">Export .vox</button></div>
<div id="log-entries"></div>
</div>
</div>
<div id="vh2"></div>
<div id="right">
<div id="settings-actions">
<button id="settings-refresh" >Refresh</button>
<button id="settings-reset" >Reset</button>
</div>
<details open><summary>Controls</summary><div class="sec">
<label class="row"><input id="speed" type="range" min="8" max="2048" step="8" value="128">Move speed <span id="speed-v">128</span> </label>
<label class="row"><input id="sens" type="range" min="5" max="100" step="5" value="25">Mouse sensitivity <span id="sens-v">25</span> </label>
</div></details>
<details open><summary>Display</summary><div class="sec">
<label ><select id="debug-mode"><option value="0">Render</option><option value="1">Steps</option><option value="2">Direct light</option><option value="3">Indirect light</option><option value="4">Bounce steps</option><option value="5">Render 2</option><option value="6">Render 3</option></select> Debug view</label>
<label class="row"><input id="fov" type="range" min="20" max="90" value="52">FOV <span id="fov-v">52</span>° </label>
<label class="row" ><input id="max-view-dist" type="number" min="0" step="64" value="0" style="width:5em"> Max view distance</label>
<label><select id="aa"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select> SSAA</label>
<label><select id="aa-mode"><option value="0">None</option><option value="1" selected>CMAA2</option></select> Anti-aliasing</label>
</div></details>
<details open><summary>Post-processing</summary><div class="sec">
<label ><select id="tonemap"><option value="0">None</option><option value="1" selected>AgX</option><option value="2">Filmic</option><option value="3">ACES</option></select> Tone mapping</label>
<label class="row"><input id="pp-brightness" type="range" min="0" max="2" step="0.05" value="1">Brightness <span id="pp-brightness-v">1</span> </label>
<label class="row"><input id="pp-contrast" type="range" min="0" max="2" step="0.05" value="1">Contrast <span id="pp-contrast-v">1</span> </label>
<label class="row"><input id="pp-saturation" type="range" min="0" max="2" step="0.05" value="1">Saturation <span id="pp-saturation-v">1</span> </label>
<label class="row"><input id="pp-vibrance" type="range" min="0" max="1" step="0.05" value="0">Vibrance <span id="pp-vibrance-v">0</span> </label>
<label class="row"><input id="denoise" type="number" min="0" max="16" step="1" value="1" style="width:5em"> Denoise strength</label>
</div></details>
<details><summary>Sun &amp; sky</summary><div class="sec">
<label class="row"><input id="sun-az" type="range" min="0" max="359" value="59">Sun azimuth <span id="sun-az-v">59</span>° </label>
<label class="row"><input id="sun-el" type="range" min="0" max="89" value="29">Sun tilt <span id="sun-el-v">29</span>° </label>
<label class="row"><input id="sun-color" type="color" value="#ffd5b4">Sun color </label>
<label class="row"><input id="ambient-color" type="color" value="#d0deef">Ambient color </label>
<label class="row"><input id="sky-zenith" type="color" value="#aac4f1">Sky zenith </label>
<label class="row"><input id="sky-horizon" type="color" value="#dfe6f0">Sky horizon </label>
<label class="row"><input id="sky-ground" type="color" value="#f9f6ed">Sky ground </label>
</div></details>
<details><summary>Direct light</summary><div class="sec">
<label ><input id="cpu-light" type="checkbox" checked> Direct light (whole-world GPU pass)</label>
<label ><select id="direct-mode"><option value="0">None</option><option value="1" selected>3×3 plane</option><option value="2">3×3×3 biased</option></select> Direct light smoothing</label>
<label><input id="prepass-on" type="checkbox" checked> Low-res prepass</label>
<label ><select id="prepass-scale"><option value="1">1</option><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option><option value="16">16</option></select> Prepass resolution ÷</label>
<label ><input id="depth-skip" type="checkbox" checked> Depth-skip empty space</label>
<label class="row" ><input id="depth-safety" type="range" min="0" max="90" step="5" value="25">Depth-skip safety <span id="depth-safety-v">25</span>% </label>
</div></details>
<details><summary>Indirect light (GI)</summary><div class="sec">
<label class="row" ><input id="indirect-dist" type="number" min="0" step="16" value="1024" style="width:5em"> Max bounce distance</label>
<label><select id="indirect-scale"><option value="1">1</option><option value="2" selected>2</option><option value="4">4</option><option value="8">8</option><option value="16">16</option></select> Indirect pass resolution ÷</label>
<label ><input id="indirect-smooth" type="checkbox" checked> Indirect light smoothing</label>
<label class="row"><input id="spatial-strength" type="range" min="0" max="100" step="5" value="5" style="width:8em"> Spatial reuse strength <span id="spatial-strength-v">5</span>%</label>
<label ><input id="indirect-bake" type="checkbox" checked> Off-screen bounce pre-bake</label>
<label ><input id="bounce-sun-dom" type="checkbox"> Sun-dominant bleed (BotVox)</label>
<label><select id="restir-spatial"><option value="0">Off</option><option value="1" selected>Hue-only</option><option value="2">Full combine</option></select> ReSTIR spatial reuse</label>
</div></details>
<details><summary>Surface detail</summary><div class="sec">
<label class="row"><input id="ao" type="range" min="0" max="1" step="0.05" value="0.25">AO <span id="ao-v">0.25</span> </label>
<label class="row"><input id="mat-bleed" type="number" min="0" max="16" step="1" value="2" style="width:5em"> Material bleed (sub-N×N px)</label>
<label><input id="mat-bleed-cross" type="checkbox" checked> Material bleed: cross sections</label>
</div></details>
<details><summary>Atmosphere</summary><div class="sec">
<label><input id="fog" type="checkbox"> Fog</label>
<label class="row" ><input id="fog-dist" type="number" min="200" max="6000" step="50" value="2000" style="width:5em">Fog distance</label>
<label class="row" ><input id="fog-height" type="number" min="0" max="100" step="1" value="0" style="width:5em">Fog height falloff</label>
<label class="row" ><input id="fog-sun" type="number" min="0" max="100" step="1" value="0" style="width:5em">Fog sun glow</label>
<label class="row"><input id="fog-color" type="color" value="#aebfd4">Fog color </label>
<label><input id="ray" type="checkbox"> Rayleigh (aerial perspective)</label>
<label class="row"><input id="ray-dist" type="range" min="400" max="8000" step="100" value="3000">Atmosphere distance <span id="ray-dist-v">3000</span> </label>
<label class="row"><input id="ray-color" type="color" value="#a9c4f0">Atmosphere color </label>
</div></details>
</div>
<script src="odin.js"></script>
<script src="wgpu.js"></script>
<script src="wgpu_fastpath.js"></script>
<script src="ace/ace.js"></script>
<script src="ace/ext-language_tools.js"></script>
<script src="ace/shp_completions.js"></script>
<script>const USE_WGPU_FASTPATH = true;
const wmi = new window.odin.WasmMemoryInterface();
const webgpu = new window.odin.WebGPUInterface(wmi);
const canvas = document.getElementById("canvas");
const LOG_EL = document.getElementById('log-entries');
const LOG_LEVEL_CLASS = ['lvl-error', 'lvl-warn', 'lvl-info', 'lvl-debug'];
const LOG_LEVEL_TAG = ['ERR', 'WRN', 'INF', 'DBG'];
const LOG_MAX_ENTRIES = 500;
const _logDecoder = new TextDecoder();
function appendLog(level, text) {
const div = document.createElement('div');
div.className = 'entry ' + (LOG_LEVEL_CLASS[level] || 'lvl-info');
div.textContent = (LOG_LEVEL_TAG[level] || '?') + ' ' + text;
LOG_EL.appendChild(div);
while (LOG_EL.childNodes.length > LOG_MAX_ENTRIES) LOG_EL.removeChild(LOG_EL.firstChild);
LOG_EL.scrollTop = LOG_EL.scrollHeight;
}
function remapShpLine(text) {
const sm = window.__sourceMap;
if (!sm || !sm.length) return text;
return text.replace(/<input>: shp: (\d+):(\d+):/, (_, lineStr, colStr) => {
const line = parseInt(lineStr, 10);
const e = sm[line - 1];
if (!e) return _;
return `${e.source}: shp: ${e.line}:${colStr}:`;
});
}
const genvox = {
request_pointer_lock: () => { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); },
pointer_locked: () => (document.pointerLockElement === canvas) ? 1 : 0,
log: (level, ptr, len) => {
const text = _logDecoder.decode(new Uint8Array(wmi.memory.buffer, ptr >>> 0, len).slice());
appendLog(level, remapShpLine(text));
},
};
const wgpuIface = webgpu.getInterface();
if (USE_WGPU_FASTPATH && typeof installWgpuFastPath === "function") {
installWgpuFastPath(webgpu, wgpuIface);
}
wmi.memory = new WebAssembly.Memory({ initial: 1024, maximum: 65536 });
window.odin.runWasm("genvox.wasm", null, { wgpu: wgpuIface, genvox }, wmi);
let mouseDX = 0, mouseDY = 0;
window.addEventListener('mousemove', e => {
if (document.pointerLockElement !== canvas) return;
mouseDX += e.movementX;
mouseDY += e.movementY;
});
const editModeEl = document.getElementById('edit-mode');
const editRadiusEl = document.getElementById('edit-radius');
const editMaterialEl = document.getElementById('edit-material');
window.addEventListener('mousedown', e => {
if (e.button !== 0) return;
if (document.pointerLockElement !== canvas) return;
const fn = wmi.exports && wmi.exports.edit_apply;
if (!fn) return;
const mode = parseInt(editModeEl.value, 10) || 0;
const radius = Math.max(1, Math.min(512, parseInt(editRadiusEl.value, 10) || 16));
const material = parseInt(editMaterialEl.value, 10) || 0;
fn(mode, radius, material);
});
const KEY_CODES = {
KeyW: 0, KeyS: 1, KeyA: 2, KeyD: 3,
Space: 4, ShiftLeft: 5, ShiftRight: 5,
ArrowLeft: 6, ArrowRight: 7, ArrowUp: 8, ArrowDown: 9,
};
function onKey(e, down) {
const id = KEY_CODES[e.code];
if (id === undefined) return;
const locked = document.pointerLockElement === canvas;
if (down && !locked) return;
if (locked && (id === 4 || (id >= 6 && id <= 9))) e.preventDefault();
if (down && e.repeat) return;
const fn = wmi.exports && wmi.exports.apply_control;
if (fn) fn(id, down ? 1 : 0);
}
window.addEventListener('keydown', e => onKey(e, true));
window.addEventListener('keyup', e => onKey(e, false));
const rootStyle = document.documentElement.style;
function makeDraggable(handle, prop, axis, fromRight) {
handle.addEventListener('pointerdown', e => {
e.preventDefault();
const rect = document.body.getBoundingClientRect();
const onmove = ev => {
let p;
if (axis === 'x') {
p = fromRight
? (rect.right - ev.clientX) / rect.width
: (ev.clientX - rect.left) / rect.width;
} else {
p = (ev.clientY - rect.top) / rect.height;
}
rootStyle.setProperty(prop, (Math.max(0.05, Math.min(0.9, p)) * 100) + '%');
};
const onup = () => {
window.removeEventListener('pointermove', onmove);
window.removeEventListener('pointerup', onup);
};
window.addEventListener('pointermove', onmove);
window.addEventListener('pointerup', onup);
});
}
makeDraggable(document.getElementById('vh1'), '--lw', 'x', false);
makeDraggable(document.getElementById('vh2'), '--rw', 'x', true);
makeDraggable(document.getElementById('hh'), '--th', 'y', false);
function wireRange(id, label, callName, mapper) {
const el = document.getElementById(id);
const vEl = document.getElementById(label);
if (!el) return;
const send = () => {
vEl.textContent = el.value;
const fn = wmi.exports && wmi.exports[callName];
if (fn) fn(mapper ? mapper(parseFloat(el.value)) : parseFloat(el.value));
};
el.addEventListener('input', send);
const t = setInterval(() => { if (wmi.exports && wmi.exports[callName]) { send(); clearInterval(t); } }, 100);
}
wireRange('speed', 'speed-v', 'set_move_speed');
wireRange('sens', 'sens-v', 'set_mouse_sensitivity', v => v / 10000);
wireRange('fov', 'fov-v', 'set_fov');
wireRange('sun-az', 'sun-az-v', 'set_sun_azimuth');
wireRange('sun-el', 'sun-el-v', 'set_sun_elevation');
wireRange('ao', 'ao-v', 'set_ao');
wireValue('fog-dist', 'change', 'set_fog_distance', el => parseFloat(el.value) || 0);
wireValue('fog-height', 'change', 'set_fog_height_falloff', el => (parseFloat(el.value) || 0) * 1e-4);
wireValue('fog-sun', 'change', 'set_fog_sun', el => (parseFloat(el.value) || 0) / 100);
wireRange('ray-dist', 'ray-dist-v', 'set_rayleigh_distance');
wireRange('depth-safety', 'depth-safety-v', 'set_prepass_depth_safety', v => v / 100);
function wireValue(id, evt, callName, mapper) {
const el = document.getElementById(id);
if (!el) return;
const send = () => {
const fn = wmi.exports && wmi.exports[callName];
if (fn) fn(mapper(el));
};
el.addEventListener(evt, send);
const t = setInterval(() => { if (wmi.exports && wmi.exports[callName]) { send(); clearInterval(t); } }, 100);
}
wireValue('debug-mode', 'change', 'set_debug_mode', el => parseInt(el.value, 10));
wireValue('aa', 'change', 'set_aa_samples', el => parseInt(el.value, 10));
wireValue('aa-mode', 'change', 'set_aa_mode', el => parseInt(el.value, 10));
wireValue('tonemap', 'change', 'set_tonemap_mode', el => parseInt(el.value, 10));
wireValue('prepass-scale', 'change', 'set_prepass_scale', el => parseInt(el.value, 10));
wireValue('fog', 'change', 'set_fog_enabled', el => el.checked ? 1 : 0);
wireValue('ray', 'change', 'set_rayleigh_enabled', el => el.checked ? 1 : 0);
wireValue('depth-skip', 'change', 'set_prepass_depth', el => el.checked ? 1 : 0);
wireValue('prepass-on', 'change', 'set_prepass_enabled', el => el.checked ? 1 : 0);
